<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Viacheslav Hryshko</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/apple-touch-icon.png" type="image/png">
<meta name="theme-color" content="#1c3f66">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#101827;--ink-soft:#4b5768;--line:rgba(16,24,39,.12);--accent:#1c3f66;--gold:#b8902e;--font:'Calibri','Carlito',-apple-system,"Segoe UI",sans-serif;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font);padding:24px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 32px;text-align:center;max-width:420px;width:100%;box-shadow:0 1px 2px rgba(16,24,39,.05),0 14px 32px -16px rgba(16,24,39,.18);}
.code{font-size:2.6rem;font-weight:800;color:var(--accent);margin:0;letter-spacing:-.02em;}
p{color:var(--ink-soft);margin:8px 0 22px;}
a{display:inline-block;padding:12px 22px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;transition:border-color .2s,transform .2s;}
a:hover{border-color:var(--gold);transform:translateY(-2px);}
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <p>This page does not exist. / Diese Seite existiert nicht.</p>
    <a href="/">Startseite · Home · Головна</a>
  </main>
</body>
</html>
